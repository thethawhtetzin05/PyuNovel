name: EAS Auto Update on Push

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  update:
    name: Publish EAS Over-The-Air Update
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: ⚡ Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🚀 Publish EAS Update
        working-directory: ./mobile
        run: npx eas-cli update --auto --branch production --non-interactive --message "Auto update from commit ${{ github.sha }}"
